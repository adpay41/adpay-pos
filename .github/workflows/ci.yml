name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install · lint · test
    runs-on: ubuntu-latest
    # Database tests run against real Postgres 16, the same image docker-compose.yml uses — never PGlite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adpay
          POSTGRES_DB: adpay
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adpay -d adpay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://adpay@localhost:5432/postgres
      REQUIRE_REAL_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json —
      # specifying it here too makes pnpm fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  secret-scan:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
